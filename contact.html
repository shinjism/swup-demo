<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="./css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-25..200" rel="stylesheet">
</head>
<body>
  <!--
    #swup の外側はSwupによる差し替えの対象外。
    そのため、このaudio要素の再生状態はページを移動しても維持される。
  -->
  <audio id="audio" hidden loop preload="auto">
    <source src="./audio/aviansho9-mood-1-188071.mp3" type="audio/mpeg">
  </audio>

  <header>
    <div class="logo"><a href="./">LOGO</a></div>
    <nav>
      <ul>
        <li><a href="./about.html">About</a></li>
        <li><a href="./works.html">Works</a></li>
        <li><a href="./contact.html">Contact</a></li>
      </ul>
    </nav>
    <button id="play"></button>
  </header>

  <!-- Swupは、初期設定では id="swup" の要素だけを差し替える。 -->
  <main id="swup" class="transition-fade">
    <h1>Contact</h1>
    <p>Contactページのサンプルです。</p>
  </main>

  <footer>
    © Sample Site
  </footer>

  <!-- Swup本体を先に読み込み、その後でSwupを使うapp.jsを読み込む。 -->
  <script src="https://unpkg.com/swup@4"></script>
  <script src="./js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <link rel="stylesheet" href="./css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-25..200" rel="stylesheet">
</head>
<body>
  <!--
    #swup の外側は、Swupによるページ遷移では差し替えられない。
    同じaudio要素が残り続けるため、ページを移動しても
    再生位置と再生／停止の状態が維持される。
  -->
  <audio id="audio" hidden loop preload="auto">
    <source src="./audio/aviansho9-mood-1-188071.mp3" type="audio/mpeg">
  </audio>

  <!-- ヘッダーと再生ボタンも、ページ遷移後まで同じ要素が残る。 -->
  <header>
    <div class="logo"><a href="./">LOGO</a></div>
    <nav>
      <ul>
        <li><a href="./about.html">About</a></li>
        <li><a href="./works.html">Works</a></li>
        <li><a href="./contact.html">Contact</a></li>
      </ul>
    </nav>
    <button id="play"></button>
  </header>

  <!-- Swupは、初期設定では id="swup" の要素だけを差し替える。 -->
  <main id="swup" class="transition-fade">
    <h1>Home</h1>
    <p>サンプルトップページ</p>
    <!--
      動画は差し替え領域内にあるため、Homeを離れるとDOMから削除される。
      Homeへ戻ったときは新しいvideo要素になるので、app.jsの
      page:viewフックから再生を開始する。
      mutedは自動再生制限への対策、playsinlineはモバイル端末で
      全画面表示に切り替えずインライン再生するための指定。
    -->
    <video class="hero-video" poster="images/39220-421020366.webp" muted loop playsinline preload="auto">
      <source src="./video/39220-421020366.mp4" type="video/mp4">
    </video>
  </main>

  <footer>
    © Sample Site
  </footer>

  <!-- Swup本体を先に読み込み、その後でSwupを使うapp.jsを読み込む。 -->
  <script src="https://unpkg.com/swup@4"></script>
  <script src="./js/app.js"></script>
</body>
</html>
